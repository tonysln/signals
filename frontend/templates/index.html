<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSTV Encoder</title>
  <meta name="description" content="Free online SSTV encoder: convert PNG, JPG or BMP images into slow-scan television audio and download it as a WAV file.">
  <meta name="author" content="Anton Slavin">
  <meta name="keywords" content="SSTV, SSTV encoder, slow-scan television, SSTV online, image to SSTV, image to audio, SSTV WAV, ham radio, amateur radio, Martin, Martin M1, Martin M2, Martin M3, Martin M4, Scottie, Scottie S1, Scottie S2, Scottie S3, Scottie S4, Scottie DX, Wrasse, Wrasse SC2-30, Wrasse SC2-60, Wrasse SC2-120, Wrasse SC2-180, Pasokon, Pasokon P3, Pasokon P5, Pasokon P7, FAX480, Robot, Robot 36, Robot 72, PD, PD50, PD90, PD120, PD160, PD180, PD240, PD290">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="SSTV Encoder">
  <meta property="og:description" content="Convert images into slow-scan television audio and download it as a WAV file.">
  <meta name="twitter:card" content="summary">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <header class="pane">
      <h1>SSTV Encoder</h1>
      <p>Encode an image into a <a href="https://en.wikipedia.org/wiki/Slow-scan_television" target="_blank" rel="noopener">slow-scan television</a> audio signal, ready to play or download as a WAV file.</p>
    </header>

    <form id="form" class="pane" autocomplete="off">
      <h2>Input</h2>

      <fieldset id="inputs">
        <div class="field">
          <label for="mode">Mode <small>Protocol &amp; Size</small></label>
          <select name="mode" id="mode" required>
            {% for name, opts in modes.items() %}
            <optgroup label="{{ name }}">
              {% for m, o in opts.items() %}
              <option value="{{ m }}" data-encoding="{{ name }}" data-w="{{ o.width }}" data-h="{{ o.height }}">{{ m }} &mdash; {{ o.width }}&times;{{ o.height }}</option>
              {% endfor %}
            </optgroup>
            {% endfor %}
          </select>
        </div>

        <div class="field">
          <label for="image">Image <small>PNG, JPG, BMP</small></label>
          <div>
            <input type="file" name="image" id="image" accept=".png,.jpg,.jpeg,.bmp" required>
            <div id="dims" class="hint"></div>
          </div>
        </div>

        <div class="field">
          <label for="resize">Resize <small>Fit to Mode</small></label>
          <span>
            <input type="checkbox" name="resize" id="resize" checked>
          </span>
        </div>

        <div class="field">
          <label for="vox">VOX <small>Leader Tone</small></label>
          <span><input type="checkbox" name="vox" id="vox" checked></span>
        </div>

        <div class="field">
          <label for="sr">Sample Rate <small>Hz</small></label>
          <select name="sr" id="sr">
            {% for r in rates %}
            <option value="{{ r }}" {{ 'selected' if r == default_sr }}>{{ r }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="field">
          <label for="raw">Raw <small>PCM, No Header</small></label>
          <span><input type="checkbox" name="raw" id="raw"></span>
        </div>
      </fieldset>

      <img id="preview" alt="" hidden>

      <div class="actions">
        <button type="submit" id="go">Encode</button>
        <span id="status"></span>
      </div>
      <ul id="log" hidden></ul>
    </form>

    <section id="result" class="pane" hidden>
      <h2>Output</h2>
      <div class="field" id="player">
        <label>Audio <small>SSTV Signal</small></label>
        <div><audio id="audio" controls></audio></div>
      </div>
      <div class="field">
        <label>File <small id="kind">WAV</small></label>
        <a id="download" download>Download</a>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
